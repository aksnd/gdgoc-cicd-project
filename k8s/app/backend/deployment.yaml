apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0     # 새 Pod 준비 완료 전엔 기존 Pod 절대 안 죽임 → 무중단
  template:
    metadata:
      labels:
        app: backend
    spec:
      terminationGracePeriodSeconds: 3600
      containers:
        - name: backend
          image: nqueens-backend:latest
          imagePullPolicy: IfNotPresent  # 로컬 이미지 사용. Docker Hub 쓸 땐 Always로 변경
          command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--timeout-graceful-shutdown", "3600"]
          ports:
            - containerPort: 8000
          env:
            - name: APP_VERSION
              valueFrom:
                configMapKeyRef:
                  name: nqueens-config
                  key: APP_VERSION
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          readinessProbe:          # 이 체크 통과해야 트래픽 받음 → 무중단의 핵심
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:           # 죽은 Pod 자동 재시작
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
