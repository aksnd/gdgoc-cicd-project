# kube-prometheus-stack Helm values (로컬 데모용 경량 설정)
# 설치 명령:
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm repo update
#   helm install prometheus prometheus-community/kube-prometheus-stack \
#     -f k8s/monitoring/values.yaml \
#     --namespace monitoring --create-namespace
#
# Grafana 접속: http://localhost:3001  (admin / admin)

grafana:
  adminPassword: admin
  service:
    type: LoadBalancer
    port: 3001
  defaultDashboardsTimezone: Asia/Seoul

# 로컬 데모용 리소스 제한
prometheus:
  prometheusSpec:
    retention: 6h
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

# 데모에서 불필요한 컴포넌트 비활성화
alertmanager:
  enabled: false

nodeExporter:
  enabled: true
